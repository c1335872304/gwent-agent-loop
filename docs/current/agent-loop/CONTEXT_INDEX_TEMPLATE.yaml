# ContextIndex v1
# 事实导航索引；每条事实都必须能够回到来源和 snapshot。
index_version: 1
workspace_snapshot: "<git commit, worktree manifest, or pending-baseline marker>"
generated_at: "YYYY-MM-DD hhmm"
entry_cards:
  core:
    card: "docs/current/agent-entry/CORE.md"
    owner: "core"
    skill: ".agents/skills/core-environment/SKILL.md"
    required_markers: ["Core", "check_schema.py", "handoff"]
  trainer:
    card: "docs/current/agent-entry/TRAINER.md"
    owner: "trainer"
    skill: ".agents/skills/training-config/SKILL.md"
    required_markers: ["Trainer", "validate_training.py", "handoff"]
  product:
    card: "docs/current/agent-entry/PRODUCT.md"
    owner: "product"
    skill: ".agents/skills/product-integration/SKILL.md"
    required_markers: ["Product", "npm run build", "handoff"]
  teacher:
    card: "docs/current/agent-entry/TEACHER.md"
    owner: "teacher"
    skill: ".agents/skills/teacher-explanation/SKILL.md"
    required_markers: ["Teacher", "check_teacher.py", "handoff"]
context_policy:
  version: 1
  read_order:
    - "user_request_and_safety"
    - "AGENTS.md"
    - "docs/current/AGENT_ONBOARDING_INDEX.md"
    - "docs/current/agent-loop/CONTEXT_INDEX.yaml#context_policy"
    - "docs/current/agent-loop/START_HERE.md"
    - "docs/current/agent-loop/CURRENT_STATE.md"
    - "domain_entry_card_then_skill_contract"
    - "task_specific_code_test_and_lessons"
  authority_order:
    - "user_request_and_safety"
    - "AGENTS.md"
    - "domain_skill_and_contract"
    - "current_code_and_snapshot"
    - "task_packet_and_reports"
    - "archive"
  required_floor:
    - "AGENTS.md"
    - "docs/current/AGENT_ONBOARDING_INDEX.md"
    - "docs/current/agent-loop/CONTEXT_INDEX.yaml"
    - "docs/current/agent-loop/START_HERE.md"
    - "docs/current/agent-loop/CURRENT_STATE.md"
  domain_route: "docs/current/agent-entry/<DOMAIN>.md -> Skill -> contract -> nearest code/test"
  default_exclusions:
    - "raw conversation"
    - "full repository scan"
    - "historical archive"
    - "docs/current/agent-loop/pilots/ compatibility fixtures"
    - "models/v3/policy.pt unless Trainer task"
    - "external ZIPs"
  handoff_payload:
    - "TaskPacket"
    - "ContextBrief"
    - "ChangeReport"
    - "final_snapshot"
    - "contract_diff"
  stop_on:
    - "missing_authority"
    - "conflicting_contract"
    - "snapshot_drift"
    - "privacy_uncertainty"
    - "budget_or_permission_uncertainty"
entries:
  - id: "<stable-fact-id>"
    domain: "core | trainer | product | teacher | verification | project"
    claim: "<one precise fact; do not combine unrelated claims>"
    source_refs:
      - path: "<repo-relative path>"
        locator: "<line, key, symbol, or section>"
        source_kind: "rule | contract | skill | test | architecture | lesson"
    verified_at: "YYYY-MM-DD hhmm"
    verified_snapshot: "<same snapshot family as workspace_snapshot>"
    status: "confirmed | inferred | superseded"
    confidence: "high | medium | low"
    trigger_terms: []
    owner: "core | trainer | product | teacher | verification | project"
    lesson_refs: []
    supersedes: []
    superseded_by: []
    notes: ""

maintenance:
  stale_after_days: 30
  stale_policy: "stale entries require re-verification before implementation; they are not silently deleted"
  conflict_policy: "current authoritative contract wins; unresolved conflict becomes HUMAN_REQUIRED"
  write_policy: "only confirmed or explicitly marked inferred facts may be added; claims from a task report do not become confirmed automatically"
