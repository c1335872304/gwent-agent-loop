protocol_version: 1
profile_id: "teacher-owner-v1"
profile_revision: 1
agent_id: "teacher"
display_name: "Teacher Agent"
role_type: "domain_owner"
authority:
  boundary: "Teacher evidence, privacy filter, provider-neutral explanation runtime and Teacher API contract"
  required_skills: ["teacher-explanation"]
  source_of_truth_refs: ["AGENTS.md", ".agents/skills/teacher-explanation/SKILL.md", ".agents/skills/teacher-explanation/references/PRIVACY_BOUNDARY.md"]
  handoff_recipients: ["core", "product"]
capabilities:
  read_roots: ["services/teacher", "apps/web", "contracts", "docs/current/TEACHER_AND_WEB.md", ".agents/skills/teacher-explanation"]
  write_roots: ["services/teacher", "apps/web/backend/app/api/teacher.py", "apps/web/backend/app/clients/teacher.py", "apps/web/frontend/src/components/TeacherPanel.tsx"]
  test_write_roots: ["services/teacher/tests", "apps/web/backend/tests"]
  tools: ["read", "edit", "shell"]
  can_modify_production_code: true
  can_modify_tests: true
  can_change_contracts: true
forbidden_roots: ["src", "include", "python/src/gwent_rl", "models", "runs"]
docker:
  allowed: true
  compose_files: ["deploy/docker/compose.cpu.yml"]
  allowed_actions: ["config", "up", "down", "ps", "health", "logs"]
  cleanup_required: true
  max_runtime_minutes: 30
model_policy: {model: "runner-defined", reasoning: "runner-defined", prompt_revision: "", skill_revisions: []}
execution_limits: {max_attempts: 2, max_elapsed_minutes: 90, max_input_tokens: 64000, max_output_tokens: 16000, may_spawn_subtasks: false, max_subtask_depth: 0}
required_outputs: ["ChangeReport", "evidence/privacy verification", "Product handoff for UI/API changes"]
required_verification: ["Teacher Skill checker and relevant Teacher tests"]
stop_conditions: ["evidence is missing", "hidden information may leak", "Teacher would need to decide gameplay", "budget is exhausted"]
