# 事实来源索引与任务工作集；不是聊天摘要，也不是封闭文件白名单。
task_id: ""
packet_revision: 1
context_snapshot: ""
prepared_by: "planner | owner"
context_policy_ref: "docs/current/agent-loop/CONTEXT_INDEX.yaml#context_policy"

assembly:
  # 只记录本任务实际装入、排除和未决的上下文；不要复制共享策略。
  included_refs: []
  excluded_refs: []
  authority_conflicts: []

problem_model:
  current_behavior: ""
  expected_behavior: ""
  user_visible_impact: ""
  hypotheses:
    - statement: ""
      status: "confirmed | inferred | unknown"
      evidence_ref: ""

context_floor_refs:
  - path: "AGENTS.md"
    role: "repository governance"
    snapshot_or_version: ""
  - path: ""
    role: "required skill | contract | architecture anchor"
    snapshot_or_version: ""

fact_source_graph:
  - path: ""
    category: "production | test | contract | trace | adjacent_implementation | decision"
    why_relevant: ""
    read_status: "required | read | excluded"

exploration:
  allowed_neighbor_roots: []
  search_terms: []
  questions_to_resolve: []

fact_ledger:
  - fact: ""
    status: "confirmed | inferred | unknown"
    source_ref: "path:line or artifact ref"
    snapshot: ""

excluded_leads:
  - lead: ""
    evidence: ""

lessons:
  relevant_refs: []
  searched_trigger_terms: []
  applied: []
  rejected_as_stale_or_irrelevant: []

# E3 advisory：只能放置 E2 selected 的 confirmed/promoted 经验；不得进入 context_floor_refs。
advisory:
  enabled: false
  status: "empty | applied | unavailable | blocked"
  source_report_ref: "ShadowRetrieval.yaml"
  items: []
  omitted: []
  limits:
    max_items: 3
    max_tokens: 1500
    used_items: 0
    used_tokens: 0
  adoption:
    status: "not_recorded | recorded"
    adopted_lesson_ids: []
    not_adopted_lesson_ids: []
    evidence_ref: ""

contradictions_or_blockers: []
